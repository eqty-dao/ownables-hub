name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://ownables:ownables@127.0.0.1:5432/ownables_hub_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ownables_hub_test
          POSTGRES_USER: ownables
          POSTGRES_PASSWORD: ownables
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownables -d ownables_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Record dev-watch environment
        run: |
          node --version
          yarn --version
          uname -a
          ulimit -n

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fresh migration chain
        run: yarn db:migrate:up

      - name: No-op migration chain
        run: yarn db:migrate:up

      - name: Dev-watch verifier
        run: yarn verify:dev-watch

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Core compatibility smoke
        run: yarn verify:core-compat

      - name: Native compiled-process E2E
        run: yarn test:e2e

      - name: Build
        run: yarn build

      - name: Replay boundary verifier
        run: yarn verify:hub-replay-boundary

      - name: Regular Nest start live routes
        shell: bash
        run: |
          set -euo pipefail
          storage_root="$(mktemp -d)"
          hub_log="$(mktemp)"
          health_body="$(mktemp)"
          chains_body="$(mktemp)"
          hub_pid=""
          cleanup() {
            if [[ -n "$hub_pid" ]] && kill -0 "$hub_pid" 2>/dev/null; then
              kill -TERM -- "-$hub_pid" || true
              wait "$hub_pid" || true
            fi
            echo '=== yarn start output ==='
            cat "$hub_log"
            rm -rf "$storage_root" "$hub_log" "$health_body" "$chains_body"
          }
          trap cleanup EXIT
          test -f dist/main.js
          ! grep -nF -- '--preserve-symlinks' package.json
          env \
            NODE_ENV=test \
            PORT=3101 \
            PUBLIC_BASE_URL=http://127.0.0.1:3101 \
            OWNABLES_STORAGE="file://$storage_root" \
            SIGNER_MNEMONIC='test test test test test test test test test test test junk' \
            setsid yarn start >"$hub_log" 2>&1 &
          hub_pid=$!
          ready=''
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3101/health >"$health_body"; then
              ready=1
              break
            fi
            sleep 1
          done
          test -n "$ready"
          curl -fsS http://127.0.0.1:3101/ownables/chains >"$chains_body"
          node -e "const fs = require('node:fs'); const health = JSON.parse(fs.readFileSync(process.argv[1])); JSON.parse(fs.readFileSync(process.argv[2])); if (health.status !== 'ok') throw new Error('Expected /health status ok');" "$health_body" "$chains_body"
          cat "$health_body"
          cat "$chains_body"

      - name: Production entrypoint live routes
        shell: bash
        run: |
          set -euo pipefail
          storage_root="$(mktemp -d)"
          hub_log="$(mktemp)"
          health_body="$(mktemp)"
          chains_body="$(mktemp)"
          hub_pid=""
          cleanup() {
            if [[ -n "$hub_pid" ]] && kill -0 "$hub_pid" 2>/dev/null; then
              kill -TERM -- "-$hub_pid" || true
              wait "$hub_pid" || true
            fi
            echo '=== yarn start:prod output ==='
            cat "$hub_log"
            rm -rf "$storage_root" "$hub_log" "$health_body" "$chains_body"
          }
          trap cleanup EXIT
          test -f dist/main.js
          ! grep -nF -- '--preserve-symlinks' package.json
          env \
            NODE_ENV=test \
            PORT=3102 \
            PUBLIC_BASE_URL=http://127.0.0.1:3102 \
            OWNABLES_STORAGE="file://$storage_root" \
            SIGNER_MNEMONIC='test test test test test test test test test test test junk' \
            setsid yarn start:prod >"$hub_log" 2>&1 &
          hub_pid=$!
          ready=''
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3102/health >"$health_body"; then
              ready=1
              break
            fi
            sleep 1
          done
          test -n "$ready"
          ps -ax -o pid=,command= | grep '[d]ist/main\.js'
          curl -fsS http://127.0.0.1:3102/ownables/chains >"$chains_body"
          node -e "const fs = require('node:fs'); const health = JSON.parse(fs.readFileSync(process.argv[1])); JSON.parse(fs.readFileSync(process.argv[2])); if (health.status !== 'ok') throw new Error('Expected /health status ok');" "$health_body" "$chains_body"
          cat "$health_body"
          cat "$chains_body"

      - name: Unit tests
        run: yarn test --runInBand

  release:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn release
