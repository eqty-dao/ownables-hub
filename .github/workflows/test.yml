name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://ownables:ownables@127.0.0.1:5432/ownables_hub_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ownables_hub_test
          POSTGRES_USER: ownables
          POSTGRES_PASSWORD: ownables
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownables -d ownables_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fresh migration chain
        run: yarn db:migrate:up

      - name: No-op migration chain
        run: yarn db:migrate:up

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Native compiled-process E2E
        run: yarn test:e2e

      - name: Unit tests
        run: yarn test --runInBand
