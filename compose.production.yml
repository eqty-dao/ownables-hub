x-hub: &hub
  image: ${HUB_IMAGE:?Set HUB_IMAGE to the published Hub image}
  env_file:
    - ${HUB_RUNTIME_ENV_FILE:-./deploy/hub.env}
  environment:
    NODE_ENV: production
    PORT: "8000"
    PUBLIC_BASE_URL: https://${HUB_HOST:?Set HUB_HOST to the Hub hostname}
    SIWE_DOMAIN: ${HUB_HOST}
    DATABASE_URL: postgres://ownables:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}@db:5432/ownables
  volumes:
    - hub-storage:/var/lib/ownables-hub
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ownables
      POSTGRES_USER: ownables
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ownables", "-d", "ownables"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: ${HUB_IMAGE}
    environment:
      DATABASE_URL: postgres://ownables:${POSTGRES_PASSWORD}@db:5432/ownables
    command: ["node_modules/.bin/node-pg-migrate", "up", "-m", "migrations"]
    depends_on:
      db:
        condition: service_healthy

  hub:
    <<: *hub
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health', {signal: AbortSignal.timeout(4000)}).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  indexer:
    <<: *hub
    command: ["node", "deploy/indexer-loop.mjs"]

  proxy:
    image: caddy:2-alpine
    environment:
      HUB_HOST: ${HUB_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  hub-storage:
  caddy-data:
  caddy-config:
